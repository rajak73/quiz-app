name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm test
      env:
        NODE_ENV: test
        # Tests connect to an in-memory MongoDB via mongodb-memory-server (see
        # backend/tests/setup/db.js) — server.js's real connectDB() never runs under
        # Jest, so MONGODB_URI just needs to be non-empty to pass its startup check.
        MONGODB_URI: mongodb://127.0.0.1:27017/quiz-app-ci-placeholder
        JWT_SECRET: ci-test-only-jwt-secret
        FRONTEND_URL: http://localhost:5500
